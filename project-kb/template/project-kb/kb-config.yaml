# Item prefixes. You can add more if needed.
item_types:
  - prefix: "task"
    label: "Task"
  - prefix: "feat"
    label: "Feature"
  - prefix: "bug"
    label: "Bug"
  - prefix: "disc"
    label: "Discussion"
